        // 1. Render các Tab nằm ngang (Main Tabs)
        function renderMainTabs() {
            const tabsContainer = document.getElementById('mainTabs');
            tabsContainer.innerHTML = '';

            accountingData.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${index === currentCategoryIndex ? 'active' : ''}`;
                btn.textContent = item.category;
                btn.onclick = () => {
                    currentCategoryIndex = index;
                    currentLessonIndex = 0;
                    renderMainTabs();
                    renderSidebar();
                    renderLesson();
                };
                tabsContainer.appendChild(btn);
            });
        }

        // 2. Render danh sách bài học ở Sidebar
        function renderSidebar() {
            const sidebarContainer = document.getElementById('sidebarMenu');
            sidebarContainer.innerHTML = '';

            const currentCategory = accountingData[currentCategoryIndex];
            document.getElementById('sidebarHeader').textContent = currentCategory.category;

            currentCategory.lessons.forEach((lesson, index) => {
                const li = document.createElement('li');
                li.className = `menu-item ${index === currentLessonIndex ? 'active' : ''}`;
                li.textContent = lesson.title;
                li.onclick = () => {
                    currentLessonIndex = index;
                    renderSidebar();
                    renderLesson();
                };
                sidebarContainer.appendChild(li);
            });
        }

        // 3. Render Nội dung bài học chi tiết
        function renderLesson() {
            const contentContainer = document.getElementById('lessonContent');
            const lesson = accountingData[currentCategoryIndex].lessons[currentLessonIndex];

            if (!lesson) {
                contentContainer.innerHTML = '<p>Chưa có nội dung bài học.</p>';
                return;
            }

            contentContainer.innerHTML = `
                <h1 class="article-title">${lesson.title}</h1>
                <div class="article-body">
                    ${lesson.description}
                    
                    ${lesson.example ? `
                        <div class="box-example">
                            <div class="box-example-title">${lesson.example.title}</div>
                            <div>${lesson.example.content}</div>${lesson.example.code ? `<div class="journal-code">${lesson.example.code}</div>` : ''}
                        </div>
                    ` : ''}

                    ${lesson.tip ? `
                        <div class="box-tip">
                            <div class="box-tip-title">${lesson.tip.title}</div>
                            <div>${lesson.tip.content}</div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 4. Chức năng Tra cứu / Tìm kiếm Thông minh
        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!keyword) {
                renderLesson();
                return;
            }

            const contentContainer = document.getElementById('lessonContent');
            let resultsHTML = `<h1 class="article-title">Kết quả tìm kiếm cho: "${keyword}"</h1><div class="article-body">`;
            let matchCount = 0;

            accountingData.forEach((category) => {
                category.lessons.forEach((lesson) => {
                    const fullText = (lesson.title + ' ' + lesson.description + ' ' + (lesson.example?.content || '') + ' ' + (lesson.tip?.content || '')).toLowerCase();
                    if (fullText.includes(keyword)) {
                        matchCount++;
                        resultsHTML += `
                            <div style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0;">
                                <span style="font-size: 12px; font-weight:700; color:#0284c7; background:#e0f2fe; padding: 2px 8px; border-radius: 4px;">${category.category}</span>
                                <h3 style="margin: 8px 0; color:#0f172a;">${lesson.title}</h3>
                                <div>${lesson.description}</div>
                                ${lesson.example ? `<div class="box-example"><div class="box-example-title">${lesson.example.title}</div>${lesson.example.content}</div>` : ''}
                            </div>
                        `;
                    }
                });
            });

            if (matchCount === 0) {
                resultsHTML += '<p>Không tìm thấy kết quả phù hợp với từ khóa của bạn. Hãy thử các từ khóa như: <b>111, 112, giá vốn, Nợ-Có, chứng từ...</b></p>';
            }

            resultsHTML += '</div>';
            contentContainer.innerHTML = resultsHTML;
        }

        // Khởi chạy khi load trang
        renderMainTabs();
        renderSidebar();
        renderLesson();
    </script>
</body>
</html>
